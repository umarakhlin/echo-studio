# פריסה אוטומטית ל-Vercel בכל push ל-main (או להרצה ידנית).
#
# דרושות ב-GitHub: Settings → Secrets and variables → Actions → New repository secret:
#   VERCEL_TOKEN        — מ-https://vercel.com/account/tokens (Create Token)
#   VERCEL_ORG_ID       — ב-Vercel: Project Settings → General → (העתקת Team ID / Org ID)
#   VERCEL_PROJECT_ID   — באותו מסך: Project ID
#
# אחרי שמירת הסיקרטים: כל push ל-main מריץ build + deploy ל-Production.

name: Deploy to Vercel (production)

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel env (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Vercel)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
